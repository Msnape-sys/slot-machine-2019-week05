<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win Big Slot Machine</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
</head>
<body>
   

<header><h1>The Appointment</h1>
<p>Choose your service. Take your chances</p></header>
<main>
<section class="gameInfo">
    <section id="cashPool">
        <h2>Beauty Budget</h2>  <p>$<span id="balance">1000</span></p></section>
    <section><h2>Current Service</h2>
    <p id="bet">None Selected</p></section>

    <section> <h2>Beauty Bonus</h2>
    <p id="winnings">$0</p></section>
</section>

<section class="reels"> 
    <section id="reel1"> </section>
    <section id="reel2"> </section>
    <section id="reel3"> </section>
</section>

<section class="controls">
    <button class="button serviceButton" id="buttonMinBet">Touch Up<span>$100</span></button>
    <button class="button bookButton" id="spin">Book</button>
    <button class="button serviceButton" id="buttonMaxBet">Full Service<span>$500</span></button>

</section>

<section class="result"><p id="result">Choose a service type to begin</p></section>
</main>
<script src="js/main.js"></script>
</body>
</html>
